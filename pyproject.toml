[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelops"
version = "1.0.0"
description = "SentinelOps — Secure AI Control Plane for LLM Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "PyJWT>=2.8,<3.0",
    "PyYAML>=6.0,<7.0",
    "jsonschema>=4.21,<5.0",
    "scikit-learn>=1.4,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
