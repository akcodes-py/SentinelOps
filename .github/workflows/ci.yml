name: SentinelOps CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps --no-build-isolation
      - name: Validate and diff policy
        run: |
          python -c "from sentinelops.guardrails.policy import load_policy; print(load_policy().version)"
          python scripts/check_policy_diff.py
      - name: Unit and guardrail tests
        run: python -m pytest tests -q -m "not slow"
      - name: Fast red-team subset with ASR gate
        run: |
          python -c "from sentinelops.redteam.runner import run_suite; r=run_suite(mode='defended', split='dev', benign=True); print(r['summary']); assert r['summary']['overall_asr'] < 0.10; assert r['summary']['false_positive_rate'] < 0.05"
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  owasp-zap-baseline:
    runs-on: ubuntu-latest
    needs: security-regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Start SentinelOps gateway
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps --no-build-isolation
          nohup python -m uvicorn sentinelops.app.main:app --host 127.0.0.1 --port 8010 &
          sleep 3
          curl -f http://127.0.0.1:8010/health
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://127.0.0.1:8010/openapi.json"
          fail_action: true
          allow_issue_writing: false
